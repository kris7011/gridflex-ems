name: C++ Quality

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        name: Configure, build, test and smoke test
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: controller

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Show tool versions
              run: |
                  cmake --version
                  c++ --version

            - name: Configure controller
              run: >
                  cmake
                  -S .
                  -B build
                  -DCMAKE_BUILD_TYPE=Release
                  -DBUILD_TESTING=ON
                  -DGRIDFLEX_BUILD_BENCHMARKS=ON

            - name: Build controller
              run: >
                  cmake
                  --build build
                  --parallel

            - name: Run controller tests
              run: >
                  ctest
                  --test-dir build
                  --output-on-failure

            - name: Run controller CLI
              run: ./build/gridflex_controller_cli

            - name: Run controller benchmark smoke test
              run: ./build/gridflex_controller_benchmark
