name: C++ Quality

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        name: Configure, build and smoke test
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: controller

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Show tool versions
              run: |
                  cmake --version
                  c++ --version

            - name: Configure controller
              run: >
                  cmake
                  -S .
                  -B build
                  -DCMAKE_BUILD_TYPE=Release

            - name: Build controller
              run: >
                  cmake
                  --build build
                  --parallel

                        - name: Build controller
              run: >
                  cmake
                  --build build
                  --parallel

            - name: Run controller tests
              run: >
                  ctest
                  --test-dir build
                  --output-on-failure

            - name: Run controller CLI
              run: ./build/gridflex_controller_cli
