name: Backend Quality

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Restore, format, build and test
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up .NET
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Show .NET version
              run: dotnet --info

            - name: Configure native controller
              run: >-
                  cmake
                  -S controller
                  -B controller/build
                  -DCMAKE_BUILD_TYPE=Release
                  -DBUILD_TESTING=OFF
                  -DGRIDFLEX_BUILD_BENCHMARKS=OFF

            - name: Build native controller library
              run: >-
                  cmake
                  --build controller/build
                  --target gridflex_controller_native
                  --parallel

            - name: Install native controller runtime
              run: >-
                  cmake
                  --install controller/build
                  --prefix controller/package
                  --component runtime

            - name: Verify installed native controller library
              run: test -f controller/package/lib/libgridflex_controller_native.so

            - name: Restore backend
              run: dotnet restore backend/GridFlex.slnx

            - name: Verify formatting
              run: >-
                  dotnet format
                  backend/GridFlex.slnx
                  --verify-no-changes
                  --no-restore

            - name: Build backend
              run: >-
                  dotnet build
                  backend/GridFlex.slnx
                  --configuration Release
                  --no-restore

            - name: Test backend
              env:
                  LD_LIBRARY_PATH: ${{ github.workspace }}/controller/package/lib
              run: >-
                  dotnet test
                  backend/GridFlex.slnx
                  --configuration Release
                  --no-build

            - name: Package Linux backend runtime
              run: bash backend/scripts/package-linux-runtime.sh

            - name: Smoke test packaged Linux backend
              env:
                  LD_LIBRARY_PATH: ${{ github.workspace }}/backend/dist/linux-x64/lib
              run: |
                  set -euo pipefail

                  application_directory="${GITHUB_WORKSPACE}/backend/dist/linux-x64/app"
                  log_file="${GITHUB_WORKSPACE}/backend-runtime.log"

                  pushd "${application_directory}" > /dev/null

                  dotnet GridFlex.Api.dll \
                      --urls http://127.0.0.1:5080 \
                      > "${log_file}" 2>&1 &
                  api_pid=$!

                  popd > /dev/null

                  cleanup() {
                      kill "${api_pid}" 2>/dev/null || true
                  }

                  trap cleanup EXIT

                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error \
                          http://127.0.0.1:5080/health/live \
                          > /dev/null; then
                          break
                      fi

                      if ! kill -0 "${api_pid}" 2>/dev/null; then
                          cat "${log_file}"
                          exit 1
                      fi

                      if [[ "${attempt}" -eq 30 ]]; then
                          cat "${log_file}"
                          exit 1
                      fi

                      sleep 1
                  done

                  if ! curl --fail --silent --show-error \
                      http://127.0.0.1:5080/health/ready \
                      > /dev/null; then
                      cat "${log_file}"
                      exit 1
                  fi
