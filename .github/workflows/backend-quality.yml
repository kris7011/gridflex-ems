name: Backend Quality

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Restore, format, build and test
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up .NET
              uses: actions/setup-dotnet@v5
              with:
                  global-json-file: global.json

            - name: Show .NET version
              run: dotnet --info

            - name: Configure native controller
              run: >-
                  cmake
                  -S controller
                  -B controller/build
                  -DCMAKE_BUILD_TYPE=Release
                  -DBUILD_TESTING=OFF
                  -DGRIDFLEX_BUILD_BENCHMARKS=OFF

            - name: Build native controller library
              run: >-
                  cmake
                  --build controller/build
                  --target gridflex_controller_native
                  --parallel

            - name: Verify native controller library
              run: test -f controller/build/libgridflex_controller_native.so

            - name: Restore backend
              run: dotnet restore backend/GridFlex.slnx

            - name: Verify formatting
              run: >-
                  dotnet format
                  backend/GridFlex.slnx
                  --verify-no-changes
                  --no-restore

            - name: Build backend
              run: >-
                  dotnet build
                  backend/GridFlex.slnx
                  --configuration Release
                  --no-restore

            - name: Test backend
              env:
                  LD_LIBRARY_PATH: ${{ github.workspace }}/controller/build
              run: >-
                  dotnet test
                  backend/GridFlex.slnx
                  --configuration Release
                  --no-build
