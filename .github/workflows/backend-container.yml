name: Backend Container

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    container:
        name: Build and smoke test container
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Build backend container image
              run: |
                  set -euo pipefail

                  docker build \
                      --file backend/Dockerfile \
                      --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                      --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                      --tag gridflex-api:ci \
                      .

            - name: Smoke test backend container
              run: |
                  set -euo pipefail

                  container_name="gridflex-api-ci"

                  cleanup() {
                      docker logs "${container_name}" || true
                      docker rm \
                          --force \
                          "${container_name}" \
                          > /dev/null 2>&1 || true
                  }

                  trap cleanup EXIT

                  docker run \
                      --detach \
                      --name "${container_name}" \
                      --publish 5080:8080 \
                      gridflex-api:ci

                  for attempt in $(seq 1 30); do
                      if curl --fail --silent --show-error \
                          http://127.0.0.1:5080/health/live \
                          > /dev/null; then
                          break
                      fi

                      if [[ "$(docker inspect \
                          --format '{{.State.Running}}' \
                          "${container_name}")" != "true" ]]; then
                          exit 1
                      fi

                      if [[ "${attempt}" -eq 30 ]]; then
                          exit 1
                      fi

                      sleep 1
                  done

                  curl --fail --silent --show-error \
                      http://127.0.0.1:5080/health/ready \
                      > /dev/null

                  docker exec \
                      "${container_name}" \
                      test -f /app/lib/libgridflex_controller_native.so

                  container_user_id="$(
                      docker exec \
                          "${container_name}" \
                          id -u
                  )"

                  if [[ "${container_user_id}" -eq 0 ]]; then
                      echo "Backend container must not run as root." >&2
                      exit 1
                  fi

            - name: Save tested container image
              run: |
                  set -euo pipefail

                  artifact_directory="artifact-output/container"
                  image_archive="${artifact_directory}/gridflex-api-ci.tar"

                  mkdir -p "${artifact_directory}"

                  docker save \
                      --output "${image_archive}" \
                      gridflex-api:ci

                  image_id="$(
                      docker image inspect \
                          --format '{{.Id}}' \
                          gridflex-api:ci
                  )"

                  printf '%s\n' "${image_id}" \
                      > "${artifact_directory}/gridflex-api-ci.image-id"

                  (
                      cd "${artifact_directory}"

                      sha256sum \
                          gridflex-api-ci.tar \
                          > gridflex-api-ci.tar.sha256
                  )

            - name: Upload tested container image
              uses: actions/upload-artifact@v7
              with:
                  name: backend-container-image-${{ github.sha }}
                  path: |
                      artifact-output/container/gridflex-api-ci.tar
                      artifact-output/container/gridflex-api-ci.tar.sha256
                      artifact-output/container/gridflex-api-ci.image-id
                  if-no-files-found: error
                  retention-days: 1
                  compression-level: 0

    artifact:
        name: Verify tested container artifact
        needs: container
        runs-on: ubuntu-latest

        steps:
            - name: Download tested container image
              uses: actions/download-artifact@v8
              with:
                  name: backend-container-image-${{ github.sha }}
                  path: artifact-output/container

            - name: Verify container artifact checksum
              working-directory: artifact-output/container
              run: |
                  set -euo pipefail

                  sha256sum \
                      --check \
                      gridflex-api-ci.tar.sha256

            - name: Load tested container image
              run: |
                  set -euo pipefail

                  docker load \
                      --input artifact-output/container/gridflex-api-ci.tar

            - name: Verify tested container identity
              run: |
                  set -euo pipefail

                  expected_image_id="$(
                      cat artifact-output/container/gridflex-api-ci.image-id
                  )"

                  actual_image_id="$(
                      docker image inspect \
                          --format '{{.Id}}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_image_id}" != "${expected_image_id}" ]]; then
                      echo "Loaded container image does not match tested image." >&2
                      echo "Expected: ${expected_image_id}" >&2
                      echo "Actual:   ${actual_image_id}" >&2
                      exit 1
                  fi

                  expected_source="https://github.com/${GITHUB_REPOSITORY}"

                  actual_source="$(
                      docker image inspect \
                          --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_source}" != "${expected_source}" ]]; then
                      echo "Container source label does not match repository." >&2
                      echo "Expected: ${expected_source}" >&2
                      echo "Actual:   ${actual_source}" >&2
                      exit 1
                  fi

                  actual_revision="$(
                      docker image inspect \
                          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_revision}" != "${GITHUB_SHA}" ]]; then
                      echo "Container revision label does not match Git commit." >&2
                      echo "Expected: ${GITHUB_SHA}" >&2
                      echo "Actual:   ${actual_revision}" >&2
                      exit 1
                  fi

    publish:
        name: Publish tested container image
        needs: artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        permissions:
            packages: write

        steps:
            - name: Download tested container image
              uses: actions/download-artifact@v8
              with:
                  name: backend-container-image-${{ github.sha }}
                  path: artifact-output/container

            - name: Verify container artifact checksum
              working-directory: artifact-output/container
              run: |
                  set -euo pipefail

                  sha256sum \
                      --check \
                      gridflex-api-ci.tar.sha256

            - name: Load tested container image
              run: |
                  set -euo pipefail

                  docker load \
                      --input artifact-output/container/gridflex-api-ci.tar

            - name: Verify tested container identity
              run: |
                  set -euo pipefail

                  expected_image_id="$(
                      cat artifact-output/container/gridflex-api-ci.image-id
                  )"

                  actual_image_id="$(
                      docker image inspect \
                          --format '{{.Id}}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_image_id}" != "${expected_image_id}" ]]; then
                      echo "Loaded container image does not match tested image." >&2
                      echo "Expected: ${expected_image_id}" >&2
                      echo "Actual:   ${actual_image_id}" >&2
                      exit 1
                  fi

                  expected_source="https://github.com/${GITHUB_REPOSITORY}"

                  actual_source="$(
                      docker image inspect \
                          --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_source}" != "${expected_source}" ]]; then
                      echo "Container source label does not match repository." >&2
                      echo "Expected: ${expected_source}" >&2
                      echo "Actual:   ${actual_source}" >&2
                      exit 1
                  fi

                  actual_revision="$(
                      docker image inspect \
                          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                          gridflex-api:ci
                  )"

                  if [[ "${actual_revision}" != "${GITHUB_SHA}" ]]; then
                      echo "Container revision label does not match Git commit." >&2
                      echo "Expected: ${GITHUB_SHA}" >&2
                      echo "Actual:   ${actual_revision}" >&2
                      exit 1
                  fi

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag tested container image
              run: |
                  set -euo pipefail

                  image_name="ghcr.io/${GITHUB_REPOSITORY,,}-backend"

                  docker tag \
                      gridflex-api:ci \
                      "${image_name}:latest"

                  docker tag \
                      gridflex-api:ci \
                      "${image_name}:sha-${GITHUB_SHA}"

            - name: Push tested container image
              run: |
                  set -euo pipefail

                  image_name="ghcr.io/${GITHUB_REPOSITORY,,}-backend"

                  docker push "${image_name}:latest"
                  docker push "${image_name}:sha-${GITHUB_SHA}"
